# Optional overlay: adds nginx (TLS termination + reverse proxy to "app")
# and certbot (Let's Encrypt certificate issuance/renewal). Use together
# with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
# See README "Развёртывание на своём сервере (Docker)" for the certbot
# bootstrap steps — a certificate must exist before nginx will start cleanly.
services:
  app:
    # Only nginx needs to be reachable from the internet; keep the app port
    # off the public interface when a TLS proxy sits in front of it.
    ports: !override
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    # No scheduled renewal loop by default — run it via cron/systemd-timer on
    # the host (see README), calling `docker compose run --rm certbot renew`.
    entrypoint: ["true"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  certbot_www:
  certbot_certs:
